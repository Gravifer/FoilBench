name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  spec-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv sync --project implementations/python --all-groups --locked
      - run: uv run --project implementations/python python tools/validate_spec.py
      - run: uv run --project implementations/python python tools/validate_acceptance_fixtures.py
      - run: uv run --project implementations/python ruff check implementations/python tools
      - run: uv run --project implementations/python pyright implementations/python
      - run: xvfb-run -a uv run --project implementations/python pytest -c implementations/python/pyproject.toml implementations/python/tests

  julia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with: {version: '1.12'}
      - uses: julia-actions/cache@v3
      - run: julia --project=implementations/julia -e 'using Pkg; Pkg.instantiate(); Pkg.test()'

  typescript:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: implementations/typescript}}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: {node-version: 24, cache: npm, cache-dependency-path: implementations/typescript/package-lock.json}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.1'
          targets: wasm32-unknown-unknown
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser:dist
        env: {CI: 'true'}

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            implementations/typescript/package-lock.json
            apps/web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.1'
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: implementations/rust
          shared-key: web-wasm
      - name: Install TypeScript solver dependencies
        run: npm ci
        working-directory: implementations/typescript
      - name: Install web dependencies
        run: npm ci
        working-directory: apps/web
      - name: Check web sources
        run: npm run check
        working-directory: apps/web
      - name: Test web units
        run: npm test
        working-directory: apps/web
      - name: Build static web artifact
        run: npm run build:pages
        working-directory: apps/web
        env:
          FOILBENCH_BASE: /FoilBench/
          FOILBENCH_RELEASE_VERSION: v0.0.0-ci
          FOILBENCH_RELEASE_COMMIT: ${{ github.sha }}
          FOILBENCH_RELEASE_BUILT_AT: '2000-01-01T00:00:00Z'
      - name: Exercise release packaging without publishing
        run: python tools/package_web_release.py --version v0.0.0-ci --output dist/ci-release
      - name: Install supported browser smoke matrix
        run: npx playwright install --with-deps chromium firefox webkit
        working-directory: apps/web
      - name: Test static web artifact
        run: npm run test:browser
        working-directory: apps/web
        env:
          CI: 'true'
      - name: Test Firefox and WebKit compatibility
        run: xvfb-run -a npm run test:browser:compat
        working-directory: apps/web
        env:
          CI: 'true'

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.1'
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with: {workspaces: implementations/rust}
      - run: cargo fmt --manifest-path implementations/rust/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path implementations/rust/Cargo.toml --workspace --all-targets --locked -- -D warnings
      - run: cargo test --manifest-path implementations/rust/Cargo.toml --workspace --locked
      - run: cargo check --manifest-path implementations/rust/Cargo.toml --locked --target wasm32-unknown-unknown -p foilbench-wasm

  rust-msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.88.0'
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with: {workspaces: implementations/rust, shared-key: msrv-1.88}
      - run: cargo check --manifest-path implementations/rust/Cargo.toml --workspace --all-targets --locked
      - run: cargo check --manifest-path implementations/rust/Cargo.toml --locked --target wasm32-unknown-unknown -p foilbench-wasm
