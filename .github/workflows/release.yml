name: Release web lab

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example v0.2.0 or v0.2.0-rc.1)
        required: true
        type: string
  push:
    tags:
      - "v*.*.*"

permissions: {}

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Build and verify release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.identity.outputs.version }}
      commit: ${{ steps.identity.outputs.commit }}
      built_at: ${{ steps.identity.outputs.built_at }}
      prerelease: ${{ steps.identity.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Resolve and validate release identity
        id: identity
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_REF_NAME: ${{ github.ref_name }}
          EVENT_SHA: ${{ github.sha }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          $versionPattern = '^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-(?:(?:0|[1-9]\d*)|(?:\d*[A-Za-z-][0-9A-Za-z-]*))(?:\.(?:(?:0|[1-9]\d*)|(?:\d*[A-Za-z-][0-9A-Za-z-]*)))*)?$'
          if ($env:EVENT_NAME -eq 'workflow_dispatch') {
              if ($env:EVENT_REF -ne 'refs/heads/main') {
                  throw 'Manual releases must run from main'
              }
              $version = $env:REQUESTED_VERSION.Trim()
              $commit = (& git rev-parse HEAD).Trim()
          }
          else {
              $version = $env:EVENT_REF_NAME
              $commit = $env:EVENT_SHA
          }
          if ($version -notmatch $versionPattern) {
              throw "Invalid release version: $version"
          }
          if ($env:EVENT_NAME -eq 'workflow_dispatch') {
              & git show-ref --verify --quiet "refs/tags/$version"
              if ($LASTEXITCODE -eq 0) {
                  throw "Tag already exists: $version"
              }
          }
          else {
              & git fetch --no-tags origin main:refs/remotes/origin/main
              if ($LASTEXITCODE -ne 0) {
                  throw 'Could not fetch origin/main for the release ancestry check'
              }
              & git merge-base --is-ancestor $commit origin/main
              if ($LASTEXITCODE -ne 0) {
                  throw "Tagged commit $commit is not reachable from origin/main"
              }
          }
          $builtAt = [DateTimeOffset]::UtcNow.ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
          $prerelease = $version.Contains('-').ToString().ToLowerInvariant()
          "version=$version" >> $env:GITHUB_OUTPUT
          "commit=$commit" >> $env:GITHUB_OUTPUT
          "built_at=$builtAt" >> $env:GITHUB_OUTPUT
          "prerelease=$prerelease" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            implementations/typescript/package-lock.json
            apps/web/package-lock.json
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: '1.98.0'
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: implementations/rust
          shared-key: web-release-wasm
      - name: Install TypeScript solver dependencies
        run: npm ci
        working-directory: implementations/typescript
      - name: Install web dependencies
        run: npm ci
        working-directory: apps/web
      - name: Check web sources
        run: npm run check
        working-directory: apps/web
      - name: Test web units
        run: npm test
        working-directory: apps/web
      - name: Build identified Pages artifact
        run: npm run build:pages
        working-directory: apps/web
        env:
          FOILBENCH_BASE: /FoilBench/
          FOILBENCH_RELEASE_VERSION: ${{ steps.identity.outputs.version }}
          FOILBENCH_RELEASE_COMMIT: ${{ steps.identity.outputs.commit }}
          FOILBENCH_RELEASE_BUILT_AT: ${{ steps.identity.outputs.built_at }}
      - name: Package release archive and checksums
        run: python tools/package_web_release.py --version "${{ steps.identity.outputs.version }}"
      - name: Verify published checksums
        run: sha256sum --check SHA256SUMS
        working-directory: dist/release
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Test identified Pages artifact
        run: npm run test:browser
        working-directory: apps/web
        env:
          CI: 'true'
      - name: Upload release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: web-release-files
          path: dist/release/*
          if-no-files-found: error
          retention-days: 7
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: apps/web/dist

  publish:
    name: Publish GitHub release
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: web-release-files
          path: dist/release
      - name: Create draft, attach assets, and publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
          RELEASE_PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          $arguments = @(
              'release', 'create', $env:RELEASE_VERSION,
              "dist/release/foilbench-web-$($env:RELEASE_VERSION).zip",
              'dist/release/SHA256SUMS',
              '--draft', '--generate-notes', '--title', "FoilBench $($env:RELEASE_VERSION)"
          )
          if ($env:EVENT_NAME -eq 'push') {
              $arguments += '--verify-tag'
          }
          else {
              $arguments += @('--target', $env:RELEASE_COMMIT)
          }
          if ($env:RELEASE_PRERELEASE -eq 'true') {
              $arguments += '--prerelease'
          }
          & gh @arguments
          if ($LASTEXITCODE -ne 0) {
              throw 'Could not create the draft GitHub release'
          }
          & gh release edit $env:RELEASE_VERSION --draft=false
          if ($LASTEXITCODE -ne 0) {
              throw 'Release assets uploaded, but the draft could not be published'
          }

  deploy:
    name: Deploy released Pages artifact
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Deploy the released build
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
