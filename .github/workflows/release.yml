name: Release web lab

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example v0.2.0 or v0.2.0-rc.1)
        required: true
        type: string
  push:
    tags:
      - "v*.*.*"

permissions: {}

concurrency:
  group: web-lab-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Build and verify release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.identity.outputs.version }}
      commit: ${{ steps.identity.outputs.commit }}
      built_at: ${{ steps.identity.outputs.built_at }}
      prerelease: ${{ steps.identity.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Resolve and validate release identity
        id: identity
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_REF_NAME: ${{ github.ref_name }}
          EVENT_SHA: ${{ github.sha }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == 'workflow_dispatch' ]]; then
            if [[ "$EVENT_REF" != 'refs/heads/main' ]]; then
              echo 'Manual releases must run from main' >&2
              exit 1
            fi
            version="$(python -c 'import os; print(os.environ["REQUESTED_VERSION"].strip())')"
            commit="$(git rev-parse HEAD)"
          else
            version="$EVENT_REF_NAME"
            commit="$EVENT_SHA"
          fi

          candidate_arguments=(
            tools/validate_web_release_candidate.py
            --candidate "$version"
            --repository .
          )
          if [[ "$EVENT_NAME" == 'workflow_dispatch' ]]; then
            candidate_arguments+=(--require-candidate-tag-absent)
          fi
          python "${candidate_arguments[@]}"

          if [[ "$EVENT_NAME" != 'workflow_dispatch' ]]; then
            git fetch --no-tags origin main:refs/remotes/origin/main
            if ! git merge-base --is-ancestor "$commit" origin/main; then
              echo "Tagged commit $commit is not reachable from origin/main" >&2
              exit 1
            fi
          fi

          built_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          if [[ "$version" == *-* ]]; then
            prerelease=true
          else
            prerelease=false
          fi
          {
            printf 'version=%s\n' "$version"
            printf 'commit=%s\n' "$commit"
            printf 'built_at=%s\n' "$built_at"
            printf 'prerelease=%s\n' "$prerelease"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            implementations/typescript/package-lock.json
            apps/web/package-lock.json
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: '1.98.1'
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: implementations/rust
          shared-key: web-release-wasm
      - name: Install TypeScript solver dependencies
        run: npm ci
        working-directory: implementations/typescript
      - name: Install web dependencies
        run: npm ci
        working-directory: apps/web
      - name: Check web sources
        run: npm run check
        working-directory: apps/web
      - name: Test web units
        run: npm test
        working-directory: apps/web
      - name: Build identified Pages artifact
        run: npm run build:pages
        working-directory: apps/web
        env:
          FOILBENCH_BASE: /FoilBench/
          FOILBENCH_RELEASE_VERSION: ${{ steps.identity.outputs.version }}
          FOILBENCH_RELEASE_COMMIT: ${{ steps.identity.outputs.commit }}
          FOILBENCH_RELEASE_BUILT_AT: ${{ steps.identity.outputs.built_at }}
      - name: Package release archive and checksums
        run: python tools/package_web_release.py --version "${{ steps.identity.outputs.version }}"
      - name: Verify published checksums
        run: sha256sum --check SHA256SUMS
        working-directory: dist/release
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Test identified Pages artifact
        run: npm run test:browser
        working-directory: apps/web
        env:
          CI: 'true'
      - name: Upload release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: web-release-files
          path: dist/release/*
          if-no-files-found: error
          retention-days: 7
      - name: Upload Pages artifact
        if: steps.identity.outputs.prerelease != 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: apps/web/dist

  publish:
    name: Publish GitHub release
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: web-release-files
          path: dist/release
      - name: Create draft, attach assets, and publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
          RELEASE_PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          arguments=(
            release create "$RELEASE_VERSION"
            "dist/release/foilbench-web-$RELEASE_VERSION.zip"
            dist/release/SHA256SUMS
            --generate-notes --latest=false
            --title "FoilBench $RELEASE_VERSION"
            --repo "$RELEASE_REPOSITORY"
          )
          if [[ "$EVENT_NAME" == 'push' ]]; then
            arguments+=(--verify-tag)
          else
            arguments+=(--target "$RELEASE_COMMIT")
          fi
          if [[ "$RELEASE_PRERELEASE" == 'true' ]]; then
            arguments+=(--prerelease)
          fi
          gh "${arguments[@]}"

  deployment_policy:
    name: Plan Pages promotion
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      deploy: ${{ steps.plan.outputs.deploy }}
      deployed_version: ${{ steps.plan.outputs.deployed_version }}
      reason: ${{ steps.plan.outputs.reason }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Compare candidate with the live Pages release
        id: plan
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail

          python tools/plan_web_deployment.py \
            --candidate "$RELEASE_VERSION" \
            --metadata-url 'https://gravifer.github.io/FoilBench/release.json' \
            --github-output "$GITHUB_OUTPUT"
      - name: Summarize promotion decision
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          DEPLOYED_VERSION: ${{ steps.plan.outputs.deployed_version }}
          DEPLOY: ${{ steps.plan.outputs.deploy }}
          REASON: ${{ steps.plan.outputs.reason }}
        run: |
          set -euo pipefail

          current="${DEPLOYED_VERSION:-none}"
          {
            printf '## Pages promotion decision\n\n'
            printf -- '- Candidate: `%s`\n' "$RELEASE_VERSION"
            printf -- '- Currently deployed: `%s`\n' "$current"
            printf -- '- Deploy: `%s`\n' "$DEPLOY"
            printf -- '- Reason: %s\n' "$REASON"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy released Pages artifact
    needs: [prepare, publish, deployment_policy]
    if: needs.deployment_policy.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Deploy the released build
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5

  promote:
    name: Mark deployed release as Latest
    needs: [prepare, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Promote the deployed GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          gh release edit "$RELEASE_VERSION" --latest --repo "$RELEASE_REPOSITORY"
